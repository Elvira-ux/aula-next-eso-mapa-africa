        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }

        @keyframes pulse-guide-poly {
            0% {
                filter: drop-shadow(0 0 4px #a3e635) drop-shadow(0 0 8px #fde047);
                fill-opacity: 0.55;
                stroke-width: 2.5;
            }
            50% {
                filter: drop-shadow(0 0 12px #84cc16) drop-shadow(0 0 20px #facc15);
                fill-opacity: 0.82;
                stroke-width: 4;
            }
            100% {
                filter: drop-shadow(0 0 4px #a3e635) drop-shadow(0 0 8px #fde047);
                fill-opacity: 0.55;
                stroke-width: 2.5;
            }
        }

        @keyframes pulse-guide-river {
            0% {
                filter: drop-shadow(0 0 4px #fef08a) drop-shadow(0 0 8px #38bdf8);
                stroke-opacity: 0.85;
            }
            50% {
                filter: drop-shadow(0 0 12px #facc15) drop-shadow(0 0 18px #0284c7);
                stroke-opacity: 1;
            }
            100% {
                filter: drop-shadow(0 0 4px #fef08a) drop-shadow(0 0 8px #38bdf8);
                stroke-opacity: 0.85;
            }
        }

        @keyframes dash-flow {
            to { stroke-dashoffset: -24; }
        }

        .guide-glow-poly {
            animation: pulse-guide-poly 1.2s infinite ease-in-out;
        }

        .guide-glow-river {
            animation: pulse-guide-river 1.2s infinite ease-in-out;
        }

        .river-flow-dash {
            stroke-dasharray: 6 6;
            animation: dash-flow 0.9s linear infinite;
        }

        @keyframes snap-pop {
            0% { transform: scale(1.16); opacity: 0.4; }
            60% { transform: scale(0.97); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .solved-snap {
            transform-box: fill-box;
            transform-origin: center;
            animation: snap-pop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .certificate-appear {
            animation: slideUp 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .diploma-font { font-family: 'Great Vibes', cursive; }

        @media print {
            @page {

                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                padding: 0 !important;
                box-shadow: none !important;
            }

        window.pointInPolygon = function(point, vs) {
            var x = point[0], y = point[1];
            var inside = false;
            for (var i = 0, j = vs.length - 1; i < vs.length; j = i++) {
                var xi = vs[i][0], yi = vs[i][1];
                var xj = vs[j][0], yj = vs[j][1];

            if (l2 === 0) return Math.hypot(p[0] - v[0], p[1] - v[1]);
            var t = ((p[0] - v[0]) * (w[0] - v[0]) + (p[1] - v[1]) * (w[1] - v[1])) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p[0] - (v[0] + t * (w[0] - v[0])), p[1] - (v[1] + t * (w[1] - v[1])));
        };

        window.distToPolyline = function(p, pts) {
            var minD = Infinity;
            for (var i = 0; i < pts.length - 1; i++) {
                var d = window.distToSegment(p, pts[i], pts[i + 1]);
                if (d < minD) minD = d;
            }
            return minD;
        };

        window.distToPolygonEdges = function(p, poly) {
            var minD = Infinity;
            for (var i = 0; i < poly.length; i++) {
                var j = (i + 1) % poly.length;
                var d = window.distToSegment(p, poly[i], poly[j]);
                if (d < minD) minD = d;
            }
            return minD;
        };

        window.isPointMatchingFeature = function(pt, feature) {
            var x = pt[0], y = pt[1];
            var dAnchor = Math.hypot(x - feature.anchor[0], y - feature.anchor[1]);

            if (feature.hitCircles) {
                return feature.hitCircles.some(function(c) { return Math.hypot(x-c[0],y-c[1]) <= c[2]; });
            }

            if (feature.type === "river") {
                var hline = feature.hitLine || feature.line;
                var riverTol = feature.hitTol || 9;
                if (window.distToPolyline(pt, hline) <= riverTol) return true;
                if (feature.extraHitLines) {
                    for (var k = 0; k < feature.extraHitLines.length; k++) {
                        if (window.distToPolyline(pt, feature.extraHitLines[k]) <= riverTol) return true;
                    }
                }
                if (feature.extraLines) {
                    for (var m = 0; m < feature.extraLines.length; m++) {
                        if (window.distToPolyline(pt, feature.extraLines[m]) <= 6) return true;
                    }
                }
                return dAnchor <= (feature.hitRadius || 12);
            }

            var hpoly = feature.hitPoly || feature.poly;
            if (hpoly) {
                if (window.pointInPolygon(pt, hpoly)) return true;
                if (window.distToPolygonEdges(pt, hpoly) <= (feature.hitTol || 3)) return true;
            }

            return (feature.type === "point" || feature.type === "peak") && dAnchor <= (feature.hitRadius || 8);
        };

        // Zones critiques: un accident extens o lineal no pot donar-se per correcte
        // sobre el nucli d'un accident veí. No altera les zones acolorides.
        // Aquesta comprovació és puntual; no declara exactitud geodèsica.
        (function () {
            var baseMatch = window.isPointMatchingFeature;
            var byNum = {};
            window.ACCIDENTS_AFRICA.forEach(function (f) { byNum[f.num] = f; });
            var higherSpecificity = {

                2: [10],             // Serralada de l'Atles: no acceptar l'estret
                4: [3, 5, 11, 12],  // Mar Roig: descartar terra i curs fluvial
                5: [12],             // Peninsula de Somalia: descartar el massis
                8: [23],             // Golf de Guinea: no confondre amb el riu Niger
                11: [3, 12, 26, 29],// Nil: descartar peninsula, massis, desert i Turkana
                13: [14, 15, 28, 29, 30],
                17: [18],
                21: [15],            // Riu Congo: no admetre el nucli de Tanganyika
                24: [23],            // Sahara: no admetre el curs del Niger
                26: [4, 12]          // Desert de Nubia: descartar mar i massis
            };
            window.isPointMatchingFeature = function(pt, feature) {
                if (!baseMatch(pt, feature)) return false;
                var exclusions = higherSpecificity[feature.num] || [];
                for (var i = 0; i < exclusions.length; i++) {
                    var id = exclusions[i];
                    if (baseMatch(pt, byNum[id])) return false;
                }
                return true;
            };
        })();

        window.pointsToSvgPoly = function(pts) {
            return pts.map(function(p) { return p[0] + "," + p[1]; }).join(" ");
        };

        window.pointsToSvgPath = function(pts) {
            return pts.map(function(p, i) { return (i === 0 ? "M" : "L") + p[0] + "," + p[1]; }).join(" ");
        };

            // Inicialització de D3 Zoom sobre el grup unificat (imatge + capes SVG)
            useEffect(() => {
                if (!svgRef.current || !viewportRef.current) return;
                const svg = d3.select(svgRef.current);
                const g = d3.select(viewportRef.current);

                const zoom = d3.zoom()

                        g.attr("transform", event.transform);
                    });

                svg.call(zoom);
                zoomBehaviorRef.current = zoom;
            }, []);

            const handleZoom = (type) => {
                if (!zoomBehaviorRef.current || !svgRef.current) return;
                const svg = d3.select(svgRef.current);
                if (type === 'in') svg.transition().duration(260).call(zoomBehaviorRef.current.scaleBy, 1.6);

                        if (isTouch && Math.abs(dy) > Math.abs(dx) * 1.25) {

                            window.removeEventListener('pointermove', onPointerMove);
                            window.removeEventListener('pointerup', onPointerUp);

                    window.removeEventListener('pointermove', onPointerMove);
                    window.removeEventListener('pointerup', onPointerUp);

                    if (dragActive) {
                        setGhostDrag(null);

                                upEvt.clientX >= rect.left &&
                                upEvt.clientX <= rect.right &&
                                upEvt.clientY >= rect.top &&
                                upEvt.clientY <= rect.bottom
                            ) {
                                const pt = clientToMapCoords(upEvt.clientX, upEvt.clientY);
                                if (pt) evaluateAttempt(feature.num, pt);
                            }
                        }
                    } else {
                        SoundEngine.playPop();
                        setSelectedNum(prev => (prev === feature.num ? null : feature.num));
                    }
                };

                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
            };
